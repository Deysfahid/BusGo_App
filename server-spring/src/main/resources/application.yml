spring:
  application:
    name: server

  # Local development secrets live in server-spring/secrets.properties, which is
  # gitignored and never committed. "optional:" means the app still starts when
  # the file is absent - as it is in production, where the same values arrive as
  # environment variables (which take precedence over imported config anyway).
  config:
    import: optional:file:./secrets.properties

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/busgo_dev}
    username: ${DB_USERNAME:postgres}
    # No default: an unset password fails loudly rather than silently falling
    # back to a value baked into a public repository.
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

app:
  jwt:
    # Must be at least 256 bits (32+ characters) for HS512; jjwt rejects
    # anything weaker, so a missing value fails rather than degrading silently.
    secret: ${APP_JWT_SECRET:}
    expirationMs: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours

# --- Authentication / onboarding ---
busgo:
  # The first admin: this Google account becomes ADMIN on first sign-in. Server-side
  # only - nobody can grant themselves ADMIN from the frontend.
  initial-admin-email: ${BUSGO_INITIAL_ADMIN_EMAIL:}

# Firebase Admin SDK (Google Sign-In identity verification only). All optional:
# when unset, the app runs normally and only Google Sign-In is disabled.
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  # Provide EITHER the raw service-account JSON (FIREBASE_SERVICE_ACCOUNT_JSON) OR a
  # path to the JSON file (GOOGLE_APPLICATION_CREDENTIALS). The JSON is a SECRET and
  # must never be committed.
  credentials-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
