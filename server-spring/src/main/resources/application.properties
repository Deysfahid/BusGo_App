busgo.geofence.radius=175
busgo.geofence.dwell-seconds=3

# --- Phase 8: ML prediction layer ---
# Master switch: false => pure heuristic ETA/crowd (app behaves as pre-Phase-8).
busgo.ml.enabled=true
# Retrain both models on this interval (ms). 1800000 = 30 minutes.
busgo.ml.retrain-interval-ms=1800000
# Synthetic bootstrap rows generated per (route, stop, hour, day) slot on first startup.
busgo.ml.synthetic.samples-per-slot=3
# RandomForest tree count for both regressors.
busgo.ml.randomforest.trees=100

# --- Abandoned active trips (conductor closed the app without pressing END) ---
# The sweeper always REPORTS stranded trips in the log. Ending them is opt-in.
busgo.trip.auto-end.enabled=false
# A trip counts as abandoned only after this long with no GPS. Hours, not minutes:
# a tunnel or a brief signal loss must never close a live trip.
busgo.trip.abandoned-after-hours=6
# How often to look (ms). 3600000 = hourly.
busgo.trip.sweep-interval-ms=3600000
